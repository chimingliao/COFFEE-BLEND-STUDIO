<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Blend Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#292a25;font:15px/1.6 system-ui,sans-serif}header{padding:22px 5%;border-bottom:1px solid #dcd8ce;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}b.brand{letter-spacing:3px;font-size:16px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #c9c5ba;background:transparent;padding:9px 15px;border-radius:5px;color:inherit}button:hover{background:#e7e3d9}button:disabled{opacity:.35;cursor:not-allowed}.primary,.active{background:#343b30;color:white;border-color:#343b30}.primary:hover,.active:hover{background:#515c48}main{max-width:1320px;margin:auto;padding:32px 5%}h1{font-size:clamp(32px,5vw,58px);font-weight:500;line-height:1.15;margin:12px 0}h2{font-size:23px;font-weight:500}small,.muted{color:#77766e}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:start}.beans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bean,.panel{background:#fffefa;border:1px solid #dedbd2;border-radius:9px;padding:20px}.bean.selected{border:2px solid #59634d;padding:19px}.bean h3{margin:7px 0;font-size:19px}.tag{display:inline-block;background:#eeece4;padding:2px 8px;border-radius:3px;margin:2px;font-size:12px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.panel{position:sticky;top:15px}.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:#e8e4da;margin:18px 0}.portion{border-bottom:1px solid #e6e2d9;padding:14px 0}input[type=range]{width:100%;accent-color:#59634d}input:not([type=range]),select{width:100%;padding:10px;border:1px solid #d5d0c4;border-radius:5px;background:white;margin:5px 0}.total{font-size:36px;font-weight:500}.warn{color:#a13e32}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.wide{width:100%}article{margin:12px 0}.order{border:1px solid #ddd8cd;padding:18px;background:white;margin:12px 0;border-radius:6px}.grams{font-size:25px;font-weight:600}nav{display:flex;gap:5px;flex-wrap:wrap}footer{padding:25px 5%;color:#777;border-top:1px solid #ddd} @media(max-width:760px){.layout{grid-template-columns:1fr}.panel{position:static}.bean{padding:13px}.bean.selected{padding:12px}main{padding:22px 4%}}@media print{header,footer,button,.no-print{display:none}main{padding:0}.order{break-inside:avoid}}

.intro{max-width:920px;margin:30px auto;text-align:center}.intro h1{margin:30px 0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:35px 0}.steps article{background:#fffefa;border:1px solid #dedbd2;padding:24px 12px;border-radius:8px}.steps b{display:block;font-size:20px;margin:12px 0}.intro .actions{justify-content:center}dialog{border:1px solid #d6d0c4;border-radius:12px;background:#eeeae2;padding:18px;max-width:94vw;max-height:92vh;overflow:auto}dialog::backdrop{background:#292a2588}#receiptCanvas{display:block;width:340px;max-width:100%;height:auto;margin:auto}dialog .actions{justify-content:center}@media(max-width:600px){.steps{grid-template-columns:repeat(2,1fr)}}@media print{body:has(dialog[open]) main{display:none}dialog[open]{position:static;max-height:none;max-width:none;border:0;padding:0;background:white}dialog .actions{display:none}#receiptCanvas{width:80mm}}
</style><header><b class="brand">COFFEE / BLEND STUDIO</b><nav id="nav"></nav></header><main id="app"></main><dialog id="receiptDialog"><canvas id="receiptCanvas" aria-label="配方小票"></canvas><div class="actions"><button onclick="downloadReceipt()">儲存 PNG</button><button onclick="window.print()">列印小票</button><button onclick="document.getElementById('receiptDialog').close()">關閉</button></div></dialog><footer>COFFEE BLEND STUDIO · MVP 1.2 · 示範資料／本機儲存</footer><script>
const seed=[['耶加雪菲','衣索比亞','水洗','中淺烘','柑橘,茉莉,紅茶',5,2,3,48],['西達摩','衣索比亞','日曬','中淺烘','莓果,桃子,蜂蜜',4,2,3,52],['肯亞 AA','肯亞','水洗','中淺烘','黑醋栗,葡萄柚,紅糖',5,3,2,58],['薇薇特南果','瓜地馬拉','水洗','中烘','可可,橙皮,焦糖',3,3,3,42],['蕙蘭','哥倫比亞','水洗','中烘','堅果,焦糖,蘋果',3,3,3,40],['黃波旁','巴西','日曬','中烘','巧克力,榛果,奶油',2,4,3,36],['曼特寧','印尼','濕刨','中深烘','黑巧克力,香料,木質',1,5,2,46],['塔拉珠','哥斯大黎加','蜜處理','中烘','蜂蜜,杏桃,太妃糖',3,3,3,54],['安提瓜','瓜地馬拉','水洗','中深烘','可可,煙燻,堅果',2,4,2,44],['巴拿馬卡杜艾','巴拿馬','水洗','中淺烘','花香,梨子,柑橘',4,2,3,65]];const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let beans=load('cbsBeans',seed.map((x,i)=>({id:i,name:x[0],origin:x[1],process:x[2],roast:x[3],tags:x[4],acid:x[5],body:x[6],sweet:x[7],price:x[8],stock:3000,on:true,date:'2026-11-24',expiry:'2026-12-24',finish:'乾淨',scene:'手沖 / 意式'}))),orders=load('cbsOrders',[]),recipes=load('cbsRecipes',[]),mix=load('cbsDraftMix',[]),recipeName=load('cbsDraftName',''),page=load('cbsSkipIntro',false)?0:5,customer={name:'',phone:'',address:''};const save=()=>{for(let [k,v] of [['cbsBeans',beans],['cbsOrders',orders],['cbsRecipes',recipes]])localStorage.setItem(k,JSON.stringify(v))};const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=id=>beans.find(b=>b.id===id);const colors=['#63745b','#aa805b','#c2ad85','#776b60'];const money=n=>'¥'+n.toFixed(2);const available=id=>get(id).stock-orders.filter(o=>o.status<2).reduce((s,o)=>s+o.lines.filter(l=>l.id===id).reduce((a,l)=>a+l.g,0),0);const usable=b=>b&&b.on&&available(b.id)>0;function saveDraft(){localStorage.setItem('cbsDraftName',JSON.stringify(recipeName));localStorage.setItem('cbsDraftMix',JSON.stringify(mix))}
function equal(){let n=mix.length;mix.forEach((m,i)=>m.p=(Math.floor(20/n)+(i<20%n?1:0))*5)}function toggle(id){if(mix.some(m=>m.id===id))mix=mix.filter(m=>m.id!==id);else if(mix.length<4&&usable(get(id)))mix.push({id,p:0});equal();saveDraft();render()}function adjust(i,v){let n=mix.length;if(n<2)return;v=Math.max(10,Math.min(100-10*(n-1),+v));let delta=v-mix[i].p;while(delta!==0){let candidates=mix.map((m,j)=>({...m,j})).filter(m=>m.j!==i&&(delta>0?m.p>10:m.p<90)).sort((a,b)=>delta>0?b.p-a.p:a.p-b.p);if(!candidates.length)break;let d=delta>0?5:-5;mix[candidates[0].j].p-=d;mix[i].p+=d;delta-=d}saveDraft();renderPanel()}const valid=()=>mix.length>=2&&mix.length<=4&&mix.reduce((s,m)=>s+m.p,0)===100&&mix.every(m=>m.p>=10&&m.p<=90&&usable(get(m.id))&&available(m.id)>=m.p*5);const total=()=>mix.reduce((s,m)=>s+(get(m.id)?.price||0)*m.p/20,0);function go(p){page=p;render()}function preset(ids,ps){mix=ids.map((id,i)=>({id,p:ps[i]}));saveDraft();render()}function storeRecipe(){if(!valid())return;recipes.unshift({name:recipeName.trim()||'未命名配方',mix:structuredClone(mix),time:new Date().toLocaleString(),receiptLines:currentLines()});save();alert('配方已收藏於此裝置')}function restore(i){mix=structuredClone(recipes[i].mix);recipeName=recipes[i].name;saveDraft();go(0)}function submit(){if(!valid()||!Object.values(customer).every(x=>x.trim())){alert('請確認配方、庫存及收貨資料');return}orders.unshift({id:'BL-'+Date.now(),name:recipeName.trim()||'自訂拼配',time:new Date().toLocaleString(),status:0,customer:{...customer},total:total(),lines:mix.map(m=>({id:m.id,name:get(m.id).name,g:m.p*5,price:get(m.id).price,amount:get(m.id).price*m.p/20,date:get(m.id).date,roast:get(m.id).roast,origin:get(m.id).origin,process:get(m.id).process}))});save();mix=[];recipeName='';saveDraft();go(2)}function advance(i){let o=orders[i];if(o.status===1){if(o.lines.some(l=>get(l.id).stock<l.g)){alert('庫存不足');return}o.lines.forEach(l=>get(l.id).stock-=l.g)}if(o.status<3)o.status++;save();render()}const status=['待稱量','稱量中','已打包','已發貨'];function renderPanel(){let p=document.getElementById('panel');if(!p)return;let focused=document.activeElement?.dataset?.idx;p.innerHTML=`<small>02 / YOUR FORMULA</small><h2>我的拼配</h2><div class="line"><span>${mix.length} / 4 款豆</span><b>500 g</b></div><div class="bar">${mix.map((m,i)=>`<div style="width:${m.p}%;background:${colors[i]}"></div>`).join('')}</div>${mix.map((m,i)=>`<div class="portion"><div class="line"><b>${e(get(m.id)?.name||'已移除')}</b><button onclick="toggle(${m.id})">移除</button></div><div class="line"><span>${m.p}% · ${m.p*5} g</span><span>${money((get(m.id)?.price||0)*m.p/20)}</span></div><input aria-label="比例" data-idx="${i}" type="range" min="10" max="${100-10*(mix.length-1)}" step="5" value="${m.p}" ${mix.length<2?'disabled':''} oninput="slide(${i},this.value)">${!usable(get(m.id))||available(m.id)<m.p*5?'<small class="warn">庫存不足或暫不可選</small>':''}</div>`).join('')}<p class="muted" id="hint">${mix.length<2?'請選擇至少兩款熟豆。':mix.filter(m=>get(m.id)?.acid>=4).length>=2?'風味提示：偏明亮果酸，適合手沖。':mix.filter(m=>get(m.id)?.body>=4&&get(m.id)?.acid<=2).length>=2?'風味提示：醇厚低酸，適合奶咖。':'風味提示：實際杯測表現仍取決於沖煮方式。'}</p><label>配方名稱<input maxlength="24" value="${e(recipeName)}" placeholder="為你的咖啡命名" oninput="recipeName=this.value;saveDraft()"></label><div class="line"><span>整包價格 / 500g</span><span class="total">${money(total())}</span></div><div class="actions"><button ${valid()?'':'disabled'} onclick="storeRecipe()">收藏配方</button><button ${valid()?'':'disabled'} onclick="showReceipt()">生成配方小票</button><button class="primary" ${valid()?'':'disabled'} onclick="go(4)">確認訂單 →</button></div>`}function slide(i,v){let n=mix.length;v=Math.max(10,Math.min(100-10*(n-1),+v));let delta=v-mix[i].p;while(delta){let a=mix.map((m,j)=>({...m,j})).filter(m=>m.j!==i&&(delta>0?m.p>10:m.p<90)).sort((a,b)=>delta>0?b.p-a.p:a.p-b.p);if(!a.length)break;let d=delta>0?5:-5;mix[a[0].j].p-=d;mix[i].p+=d;delta-=d}saveDraft();document.querySelectorAll('.portion').forEach((el,j)=>{let m=mix[j];el.querySelector('input').value=m.p;let spans=el.querySelectorAll('.line:nth-child(2) span');spans[0].textContent=m.p+'% · '+m.p*5+' g';spans[1].textContent=money(get(m.id).price*m.p/20);let w=el.querySelector('.warn');if(w)w.remove();if(!usable(get(m.id))||available(m.id)<m.p*5)el.insertAdjacentHTML('beforeend','<small class="warn">庫存不足或暫不可選</small>')});document.querySelectorAll('.bar div').forEach((el,j)=>el.style.width=mix[j].p+'%');document.querySelector('.total').textContent=money(total());document.querySelectorAll('#panel .actions button').forEach(b=>b.disabled=!valid())}
function orderHTML(o,i,admin){return `<article class="order"><div class="line"><b>${e(o.name)}</b><span class="tag">${status[o.status]}</span></div><small>${o.id} · ${e(o.time)}</small>${o.lines.map(l=>`<div class="line portion"><span>${e(l.name)}<br><small>批次 ${e(l.date)} · ${money(l.price)}/100g · ${money(l.amount)}</small></span><span class="grams">${l.g} g</span></div>`).join('')}<p>總重 500g · ${money(o.total)}</p>${admin?`<p>${e(o.customer.name)} · ${e(o.customer.phone)} · ${e(o.customer.address)}</p><button onclick="advance(${i})" ${o.status===3?'disabled':''}>${o.status===3?'已完成':'更新為 '+status[o.status+1]}</button> <button onclick="showReceipt(${i})">工單小票</button>`:''}</article>`}function edit(id,key,val){let b=get(id);b[key]=['price','stock','acid','body','sweet'].includes(key)?Math.max(0,+val):val;save()}function enterStudio(){localStorage.setItem('cbsSkipIntro',JSON.stringify(document.getElementById('skipIntro').checked));go(0)}
function currentLines(){return mix.map(m=>{let b=get(m.id);return {name:b.name,origin:b.origin,process:b.process,roast:b.roast,date:b.date,g:m.p*5,price:b.price,amount:b.price*m.p/20}})}
function savedReceipt(i){let r=recipes[i];if(r.receiptLines){drawReceipt(r.name,r.receiptLines,'RECIPE',r.time,false)}else{restore(i);if(valid())showReceipt();else alert('請先確認豆種與比例')}}
function showReceipt(i){if(i===undefined){if(!valid())return;drawReceipt(recipeName.trim()||'未命名配方',currentLines(),'RECIPE-'+Date.now(),new Date().toLocaleString(),false)}else{let o=orders[i];drawReceipt(o.name,o.lines,o.id,o.time,true)}}
let receiptName="";function drawReceipt(n,lines,id,time,production){receiptName=n;let c=document.getElementById('receiptCanvas');c.width=720;c.height=600+lines.length*154+(production?lines.length*26+40:0);let x=c.getContext('2d');x.fillStyle='#fffefa';x.fillRect(0,0,c.width,c.height);x.fillStyle='#292a25';let y=55;function t(v,size=24,bold=false,align='left',pos=42){x.font=`${bold?'bold ':''}${size}px system-ui, sans-serif`;x.textAlign=align;x.fillText(String(v),pos,y,636)}function rule(){x.strokeStyle='#99958b';x.setLineDash([8,6]);x.beginPath();x.moveTo(42,y);x.lineTo(678,y);x.stroke();x.setLineDash([])}t('COFFEE / BLEND STUDIO',30,true,'center',360);y+=40;t(production?'生產稱量工單':'PERSONAL COFFEE RECIPE',23,false,'center',360);y+=35;t(id,20,false,'center',360);y+=30;t(time,20,false,'center',360);y+=25;rule();y+=48;t(n,34,true);y+=42;t('熟豆拼配 / NET WEIGHT 500 g',24);y+=25;let offset=42;lines.forEach((l,i)=>{x.fillStyle=colors[i];let w=l.g/500*636;x.fillRect(offset,y,w,12);offset+=w});x.fillStyle='#292a25';y+=52;lines.forEach((l,i)=>{t((i+1)+'. '+l.name,29,true);y+=36;t([l.origin,l.process,l.roast].filter(Boolean).join(' / ')||'烘焙資訊未記錄',21);y+=30;t('烘焙批次 '+(l.date||'未記錄'),20);y+=34;t(l.g/5+'%',25);t(l.g+' g',36,true,'right',678);if(production){y+=26;t(money(l.price)+'/100g · '+money(l.amount),20)}y+=24;rule();y+=30});t('TOTAL / 100%',24,true);t('500 g',38,true,'right',678);y+=45;if(production){t('總價 '+money(lines.reduce((a,l)=>a+l.amount,0)),25,true);y+=40}t('依克數分別稱量熟豆，均勻混合後裝袋。',22);y+=45;t('BLENDED BY YOU.',22,true,'center',360);document.getElementById('receiptDialog').showModal()}
function downloadReceipt(){let a=document.createElement('a');a.download=(receiptName.replace(/[^\p{L}\p{N} _-]/gu,'_').trim()||'coffee-blend')+'-receipt.png';a.href=document.getElementById('receiptCanvas').toDataURL('image/png');a.click()}
function render(){document.getElementById('nav').innerHTML=['拼配工作室','我的配方','我的訂單','商家後台','確認訂單','實驗室介紹'].map((s,i)=>i===4?'':`<button class="${page===i?'active':''}" onclick="go(${i})">${s}</button>`).join('');let a=document.getElementById('app');if(page===5){a.innerHTML=`<section class="intro"><small>COFFEE BLEND STUDIO / THE ART OF PERSONAL BLENDING</small><h1>每一杯咖啡，都是你的創作。</h1><p class="muted">從十款單品熟豆中探索風味，設計專屬於你的 500g 拼配。</p><div class="steps">${[['01','探索豆種','選擇 2–4 款熟豆'],['02','調配比例','即時查看克數與價格'],['03','建立配方','命名並收藏你的創作'],['04','生成小票','儲存圖片、交給咖啡師或下單']].map(x=>`<article><small>STEP ${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></article>`).join('')}</div><div class="actions"><button class="primary" onclick="enterStudio()">開始我的第一次拼配 →</button><button onclick="enterStudio()">我是老朋友，直接進入實驗室</button></div><p><label><input id="skipIntro" type="checkbox" ${load('cbsSkipIntro',false)?'checked':''}> 下次不再顯示此介紹頁</label></p></section>`}else if(page===0){a.innerHTML=`<small>THE ART OF PERSONAL BLENDING</small><h1>你的咖啡，你的配方。</h1><p class="muted">從十款單品熟豆中，探索屬於自己的風味。每包 500g，按比例客製稱量。</p><div class="actions"><button onclick="preset([0,1,2],[50,30,20])">明亮果酸</button><button onclick="preset([5,6],[60,40])">醇厚奶咖</button><button onclick="preset([3,4,5],[30,30,40])">日常平衡</button></div><div class="layout"><section><h2>01 / 選擇熟豆</h2><div class="beans">${beans.map(b=>{let sel=mix.some(m=>m.id===b.id);return `<article class="bean ${sel?'selected':''}"><small>${e(b.origin)} / ${e(b.process)}</small><h3>${e(b.name)}</h3><span class="tag">${e(b.roast)}</span><small> ${e(b.date)}</small><p>${e(b.tags).split(',').map(t=>`<span class="tag">${t}</span>`).join('')}</p><small>酸度 ${b.acid}/5 · 醇厚 ${b.body}/5 · 甜感 ${b.sweet}/3<br>${e(b.scene)} · ${!usable(b)?'暫不可選':available(b.id)<500?'即將售罄':'庫存充足'}</small><div class="line"><b>${money(b.price)} / 100g</b><button ${!sel&&(!usable(b)||mix.length>=4)?'disabled':''} onclick="toggle(${b.id})">${sel?'✓ 已選':'＋ 加入'}</button></div></article>`}).join('')}</div></section><aside class="panel" id="panel"></aside></div>`;renderPanel()}else if(page===1){a.innerHTML='<h1>我的配方</h1>'+ (recipes.map((r,i)=>`<article class="order"><h2>${e(r.name)}</h2><p>${r.mix.map(m=>e(get(m.id)?.name||'不可用')+' '+m.p+'%').join(' / ')}</p><small>${e(r.time)}</small><div class="actions"><button onclick="restore(${i})">載入／復購</button><button onclick="savedReceipt(${i})">配方小票</button><button onclick="recipes.splice(${i},1);save();render()">刪除</button></div></article>`).join('')||'<p>尚無收藏配方。</p>')}else if(page===2){a.innerHTML='<h1>我的訂單</h1>'+(orders.map((o,i)=>orderHTML(o,i,false)).join('')||'<p>尚無訂單。</p>')}else if(page===4){a.innerHTML=`<h1>確認訂單</h1><div class="panel">${mix.map(m=>`<div class="line portion"><b>${e(get(m.id).name)}</b><span>${m.p*5} g · ${money(get(m.id).price*m.p/20)}</span></div>`).join('')}<h2>${money(total())} / 500g</h2>${[['name','姓名'],['phone','電話'],['address','地址']].map(([k,t])=>`<label>${t}<input value="${e(customer[k])}" oninput="customer.${k}=this.value"></label>`).join('')}<p class="muted">示範訂單，不會付款或寄送。</p><button onclick="go(0)">返回</button> <button class="primary" onclick="submit()">提交訂單</button></div>`}else{a.innerHTML=`<h1>生產管理</h1><p class="muted">示範後台 · 下單預留庫存，打包扣減實際庫存</p><h2>稱量工單</h2><select onchange="document.querySelectorAll('[data-status]').forEach(x=>x.hidden=this.value!==''&&x.dataset.status!==this.value)"><option value="">全部狀態</option>${status.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select>${orders.map((o,i)=>`<div data-status="${o.status}">${orderHTML(o,i,true)}</div>`).join('')||'<p>尚無工單。</p>'}<h2>熟豆及批次管理</h2>${beans.map(b=>`<details class="order"><summary>${e(b.name)} · 可售 ${available(b.id)} g</summary>${[['name','豆名'],['origin','產區'],['process','處理法'],['roast','烘焙度'],['date','烘焙日期'],['expiry','賞味期限'],['tags','風味標籤'],['acid','酸度'],['body','醇厚度'],['sweet','甜感'],['finish','餘韻'],['scene','適配場景'],['price','每100g單價'],['stock','實際庫存克數']].map(([k,t])=>`<label>${t}<input value="${e(b[k])}" onchange="edit(${b.id},'${k}',this.value)"></label>`).join('')}<label><input type="checkbox" ${b.on?'checked':''} onchange="edit(${b.id},'on',this.checked)"> 在售</label></details>`).join('')}`}}render();</script></html>
